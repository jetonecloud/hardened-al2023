---
# CIS 4.5.1, 4.5.3, 4.6.1.x, 4.6.2-4.6.6 - password, aging and umask policy.
#
# Deliberately skipped (see docs/controls.md for the full rationale):
#   - 4.4.1/4.4.2 (authselect custom profile) and 4.5.2/4.5.4
#     (faillock/pwhistory lockout + reuse) - these require regenerating
#     the authselect-managed PAM stack. A mistake there can lock out all
#     authentication fleet-wide, so this project leaves it as a
#     deliberate, documented extension point rather than guessing.
- name: CIS 4.5.1 | Configure password quality requirements
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "^#?\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop: "{{ common_pwquality | dict2items }}"

- name: CIS 4.5.3 | Ensure strong password hashing (SHA-512)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^#?\\s*ENCRYPT_METHOD"
    line: "ENCRYPT_METHOD SHA512"

- name: CIS 4.6.1.1 | Set maximum password age
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^#?\\s*PASS_MAX_DAYS"
    line: "PASS_MAX_DAYS   {{ common_pass_max_days }}"

- name: CIS 4.6.1.2 | Set minimum password age
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^#?\\s*PASS_MIN_DAYS"
    line: "PASS_MIN_DAYS   {{ common_pass_min_days }}"

- name: CIS 4.6.1.3 | Set password expiration warning age
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^#?\\s*PASS_WARN_AGE"
    line: "PASS_WARN_AGE   {{ common_pass_warn_age }}"

- name: CIS 4.6.1.4 | Set default inactive-account lock period for new users
  ansible.builtin.lineinfile:
    path: /etc/default/useradd
    regexp: "^INACTIVE="
    line: "INACTIVE={{ common_pass_inactive }}"

# CIS 4.6.1.5 is an audit-only check (no existing user's last password
# change may be in the future) - nothing to remediate on a freshly built
# image; verified by the Goss suite instead of an Ansible task.

- name: CIS 4.6.2/6.2.2/6.2.3 | Discover interactive system accounts
  ansible.builtin.getent:
    database: passwd

- name: CIS 4.6.2/6.2.2/6.2.3 | Lock shell login for non-root system accounts
  ansible.builtin.user:
    name: "{{ item.key }}"
    shell: /sbin/nologin
  loop: "{{ getent_passwd | dict2items }}"
  when:
    - item.key != 'root'
    - (item.value[1] | int) < common_system_uid_max
    - item.value[5] in ['/bin/bash', '/bin/sh', '/bin/ksh', '/bin/csh', '/bin/tcsh']
  loop_control:
    label: "{{ item.key }}"

- name: CIS 6.2.4 | Ensure root's default group is GID 0
  ansible.builtin.user:
    name: root
    group: root

- name: CIS 4.6.3/4.6.4 | Configure idle shell timeout
  ansible.builtin.copy:
    dest: /etc/profile.d/99-tmout.sh
    content: |
      # CIS 4.6.3/4.6.4: log out idle interactive shells automatically.
      TMOUT={{ common_shell_timeout }}
      readonly TMOUT
      export TMOUT
    owner: root
    group: root
    mode: "0644"

- name: CIS 4.6.5 | Configure default umask in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^#?\\s*UMASK"
    line: "UMASK           {{ common_umask }}"

- name: CIS 4.6.6 | Configure default umask for interactive shells
  ansible.builtin.copy:
    dest: /etc/profile.d/99-umask.sh
    content: |
      # CIS 4.6.6: restrictive default umask for interactive shells.
      umask {{ common_umask }}
    owner: root
    group: root
    mode: "0644"
