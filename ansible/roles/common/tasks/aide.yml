---
# CIS 1.3.1-1.3.3 - file integrity monitoring.
- name: CIS 1.3.1 | Install AIDE
  ansible.builtin.dnf:
    name: aide
    state: present

- name: CIS 1.3.1 | Check whether AIDE database already exists
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db.gz
  register: _aide_db

- name: CIS 1.3.1 | Initialize the AIDE database (first run only; can take several minutes)
  ansible.builtin.command: aide --init
  when: not _aide_db.stat.exists
  register: _aide_init
  changed_when: _aide_init.rc == 0

- name: CIS 1.3.1 | Activate the initialized AIDE database
  ansible.builtin.command: mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
  when: not _aide_db.stat.exists
  args:
    creates: /var/lib/aide/aide.db.gz

- name: CIS 1.3.3 | Ensure AIDE checks file permissions/ownership (p+u+g rules present)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: "^NORMAL\\s*="
    line: "NORMAL = FIPSR+sha512"
    create: false
  failed_when: false

- name: CIS 1.3.2 | Schedule a daily AIDE integrity check
  ansible.builtin.cron:
    name: "AIDE integrity check"
    cron_file: aide
    user: root
    minute: "{{ common_aide_cron_minute }}"
    hour: "{{ common_aide_cron_hour }}"
    job: "/usr/sbin/aide --check | /usr/bin/logger -t aide-check"
