---
# CIS Amazon Linux 2023 section 5.2 - auditd.
#
# auditd_admin_space_left_action defaults to "halt": per CIS, a system
# that can no longer guarantee audit trail integrity should stop rather
# than silently lose events. This is a real availability tradeoff - an
# instance will shut down if its audit partition fills up. If that's
# not acceptable for your workload, override this to "syslog".
auditd_max_log_file_mb: 32
auditd_num_logs: 10
auditd_max_log_file_action: keep_logs
auditd_space_left_mb: 75
auditd_space_left_action: email
auditd_admin_space_left_mb: 50
auditd_admin_space_left_action: halt
auditd_disk_full_action: halt
auditd_disk_error_action: halt
auditd_action_mail_acct: root

# CIS 5.2.1.3 (audit_backlog_limit kernel boot parameter) is skipped -
# see docs/controls.md: it requires a GRUB cmdline change and reboot
# during the build, which this project doesn't perform.

# Final line of the generated rules file sets `-e 2` (make the audit
# configuration immutable until reboot). Set to false only for local
# debugging of the ruleset itself.
auditd_make_immutable: true
