## Verifies the kernel role (CIS 1.1.1.x, 1.1.8.x, 1.1.9, 1.5.x).
kernel-param:
  kernel.randomize_va_space:
    value: "2"
  kernel.yama.ptrace_scope:
    value: "1"
  fs.suid_dumpable:
    value: "0"

file:
  /etc/modprobe.d/hardening-blacklist.conf:
    exists: true
    owner: root
    group: root

command:
  "modprobe cramfs":
    exit-status: 1
  "modprobe freevxfs":
    exit-status: 1
  "modprobe jffs2":
    exit-status: 1
  "modprobe hfs":
    exit-status: 1
  "modprobe hfsplus":
    exit-status: 1
  "modprobe udf":
    exit-status: 1
  "modprobe usb-storage":
    exit-status: 1
  "lsmod | grep -w cramfs":
    exit-status: 1
  "findmnt -no OPTIONS /dev/shm":
    exit-status: 0
    stdout:
      - "noexec"
      - "nodev"
      - "nosuid"

  # CIS 1.5.2 - NX/DEP is a hardware+kernel default on every AWS
  # x86_64/arm64 instance type, not something this role configures.
  # On x86_64 this asserts the CPU-reported `nx` flag; arm64's
  # equivalent (XN) has no cpuinfo flag to check, so it passes through.
  "sh -c 'if [ \"$(uname -m)\" = \"x86_64\" ]; then grep -qw nx /proc/cpuinfo; else true; fi'":
    exit-status: 0
